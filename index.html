<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Irish climbing weather — find where conditions are dry and climbable across Ireland's crags.">
  <meta name="theme-color" content="#2d7a2d">
  <title>Irish Climbing Weather</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="warnings-banner" role="alert" aria-live="polite"></div>
  <div id="sticky-bar">
    <div class="sticky-bar-inner">
      <div class="sticky-mode">
        <span class="mode-label">Feeling</span>
        <div class="mode-buttons">
          <button class="mode-btn" data-mode="optimistic">Opt</button>
          <button class="mode-btn" data-mode="balanced">Bal</button>
          <button class="mode-btn" data-mode="pessimistic">Pes</button>
        </div>
        <a href="#/about" class="mode-about-link">?</a>
      </div>
      <div class="sticky-freshness">
        <span id="freshness-time">—</span>
        <button id="refresh-footer-btn" title="Force refresh all data" aria-label="Refresh data">↻</button>
      </div>
    </div>
  </div>
  <main>
    <div id="app">
      <p style="padding:2rem;color:#666">Loading…</p>
    </div>
  </main>
  <footer>
    <span class="footer-attribution">
      Data: <a href="https://www.met.no/en" target="_blank" rel="noopener">MET Norway</a> ·
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
      <a href="https://www.met.ie" target="_blank" rel="noopener">Met Éireann</a> ·
      <a href="#/about">About &amp; Attribution</a>
    </span>
    <span class="freshness">Data: <span id="freshness-footer">—</span></span>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
